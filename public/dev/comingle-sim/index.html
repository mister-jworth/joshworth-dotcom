<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/f3b47bd129.js" crossorigin="anonymous"></script>
<title>Comingle Simulator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="sim-container">
    <!-- Current Week -->
    <div class="table-holder table--current">
        <div class="title--current">
            <span class="week-name">Week <span id="currentWeekNumber">0</span></span>
            <span class="playback">
                <span id="currentDay">Mon 01/01/24</span>
                <span class="icon" id="stepButton"><i class="fa-solid fa-forward-step"></i></span>
                <span class="icon" id="playButton"><i class="fa-solid fa-circle-play"></i></span>
                <span class="icon" id="pauseButton" style="display:none"><i class="fa-solid fa-pause"></i></i></span>
                <span class="icon" id="ffwdButton"><i class="fa-solid fa-forward"></i></span>
                <span class="icon" id="resetButton"><i class="fa-solid fa-arrow-rotate-left"></i></span>
            </span>
        </div>
        <div class="table" id="current-week-summary">
            <div class="table-header">
                <!--headers go here-->
            </div>
            <div class="table-row">
               <!---data goes here -->
            </div>
        </div>
        <div class="table accordion-section">
            <div class="title accordion-toggle"> 
                <span><i class="fa-solid fa-angle-right right-icon" style="display:none"></i>
                    <span>
                <span><i class="fa-solid fa-angle-down down-icon"></i>
                    </span>
                <span>Member Activity</span>
            </div>
            <div class="table accordion-content" id="current-member-activity-headers">
                <div class="table-header">
                    <!--headers go here-->
                </div>
                <div id="current-member-activity">
                    <div class="table-row member-activity-data">
                <!---data goes here -->
                </div>
                </div>
            </div>
        </div>
    </div>
    <div id="reportContainer" class="table-holder">
         <!--week reports go here-->
    </div>

</div>
<script type="text/javascript" src="money-sim.js"></script>  
</body>
</html>
