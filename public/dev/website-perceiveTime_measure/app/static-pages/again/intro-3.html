  <script type="text/javascript">
  $("#slider-range-min").slider({
    value: 1
  });

  function myinterval() {
    $('.ques').css({
      'font-size': '80px'
    });
    var num = Math.round(Math.random() * 100);
    smoothlyHtmlChange($('.ques'), num);
  }

  function smoothlyHtmlChange(obj, str) {
    obj.fadeOut('slow', function() {
      obj.html(str);
    }).delay(300).fadeIn('slow');

  }
  $(document).ready(function() {
    $.getJSON("SvgJsons/opening-rings.json", function(json) {
      comp_speedrings = new SVGAnim(json, 1200, 800, 50);
      $('svg:last-child').css({
        'width': '100%',
        'height': '100%',
        'top': '50%',
        'z-index': '-100',
        'display': 'none'
      });
      $.getJSON("SvgJsons/stop-button.json", function(json) {
        comp_speedrings = new SVGAnim(json, 87, 87, 100);
        $('svg:last-child').css('display', 'none');
        $('.ques').text("Press the button when you think a minute has passed");
        $('.ques').fadeIn('slow', function() {
          $('#downsvg').fadeIn('slow', function() {
            $('svg:last-child').fadeIn('slow');
            setTimeout(function() {
              $('#downsvg').fadeOut('slow');
              $('.ques').fadeOut('slow', function() {
                $('.ques').html("Here are some dancing curvy shapes<br/>to help you pass the time")
