  <script type="text/javascript">
  var snd = new Audio("file.wav");
  snd.currentTime = 0;

  var clickCount = 0;

  function smoothlyChange(str) {
    $('.ques').fadeOut('slow', function() {
      $('.ques').html(str);
      $('.ques').fadeIn('slow');
    });
  }
  $(document).ready(function() {
    console.log("ready!");
    $("#slider-range-min ").slider({
      value: 7
    });
    $("#slider-range-select").slider({
      slide: function(event, ui) {
        console.log($('#slider-range-select').slider("value"));
        $.cookie("yourChoice", $('#slider-range-select').slider("value"));
        $('#time').text(function() {
          val = $('#slider-range-select').slider("value");
          sec = Math.round(5 + 85 * ((val - 30) / 120));
          console.log(sec);
          return Math.floor(sec / 60) + ':' + sec % 60;
        });
        $('#time').css('left', function() {
          var temp;
          temp = $('#slider-range-select').slider("value") - 30;
          temp = Math.round(temp / 120 * 50 + 25);
          return temp + '%';
        });
      }
    });
    var past, now, delaySec, dmin, dsec;
    var data;
    $.getJSON("SvgJsons/meditation-waves.json", function(json) {
      comp_speedrings = new SVGAnim(json, 1200, 800, 50);
      $('svg:last-child').css({
        'width': '100%',
        // 'height': '200%',
        'position': 'absolute',
        'left': '50%',
        'top': '40%',
        'transform': 'translate(-50%,-50%)',
        'z-index': '-100',
        'display': 'none'

      });
      $.getJSON("SvgJsons/stop-button.json", function(json) {
        comp_speedrings = new SVGAnim(json, 87, 87, 100);
        $('svg:last-child').css({
          'width': '150px',
          'height': '150px',
          'position': 'absolute',
          'left': '50%',
          'top': '85%',
          'transform': 'translate(-50%,-50%)',
          'display': 'none'
        });
        $.getJSON("SvgJsons/go-button.json", function(json) {
          comp_speedrings = new SVGAnim(json, 87, 87, 100);
          $('svg:last-child').css({
            'width': '150px',
            'height': '150px',
            'position': 'absolute',
            'left': '50%',
            'top': '70%',
            'transform': 'translate(-50%,-50%)',
            'display': 'none'
          });
          $.getJSON("SvgJsons/next-button.json", function(json) {
            comp_speedrings = new SVGAnim(json, 79, 39, 100);
            $('svg:last-child').css({
              'position': 'absolute',
              'left': '50%',
              'top': '75%',
              'transform': 'translate(-50%,-50%)'
            });
            $('svg:last-child').click(function() {
              clickCount++;
              console.log(clickCount);

              switch (clickCount) {
                case 1:
                  $('.ques').fadeOut('slow', function() {
                    $('.ques').html("Press the green button when you're ready to begin a<br/>quiet meditation that will make time disappear.").fadeIn('slow');
                  });

                  $('svg:last-child').fadeOut('slow');
                  $('svg:last-child').prev().fadeIn('slow').click(function() {
                    var d = new Date();
                    console.log(d.getTime());
                    $.cookie("togglMeasureStart", d.getTime());
                    snd.play();
                    $('svg:last-child').prev().prev().fadeIn('slow').click(function() {
                      $.cookie('togglWhere','meditation');
                      console.log('togglWhere',$.cookie('togglWhere'));
                      window.location.pathname = pathPrefix + "actually.html";
                    });
                    $('svg:last-child').prev().prev().prev().fadeIn('slow');
                    $('svg:last-child').prev().fadeOut('slow');
                    $('#slider-range-min').fadeOut('slow');
                    $('.topShow').fadeOut('slow');
                    smoothlyChange("Press the button when you feel like a minute has passed");
                    $('#downsvg').fadeOut('slow').delay(1000).fadeIn('slow').delay(2000).fadeOut('slow', function() {
                      // smoothlyChange("Hurry!<br/>You've only got 60 seconds<br/>to make it to the one minute mark!");
                      // smoothlyChange("At this rate it'll take you the rest of the day<br/>to get to tomorrow!");
                      $('.ques').fadeOut('slow', function() {
                        $('.ques').html("Try to focus on nothing but your breathing").fadeIn('slow').delay(3000).fadeOut('slow', function() {
                          $('.ques').html("And these wavy lines.").fadeIn('slow').delay(4000).fadeOut('slow', function() {
                            $('.ques').html("And this royalty-free yoga studio music.").fadeIn('slow').delay(4000).fadeOut('slow', function() {
                              $('.ques').html("Slow deep breaths.").fadeIn('slow').delay(4000).fadeOut('slow', function() {
                                $('.ques').html("Breath in...").fadeIn('slow').delay(4000).fadeOut('slow', function() {
                                  $('.ques').html("Breath out...").fadeIn('slow').delay(4000).fadeOut('slow', function() {
                                    $('.ques').html("Let your thoughts drift past you as you breathe.").fadeIn('slow').delay(4000).fadeOut('slow', function() {
                                      $('.ques').html("Take a moment to notice how stupid<br/>your thoughts are.").fadeIn('slow').delay(4000).fadeOut('slow', function() {
                                        $('.ques').html("Just keep breathing until you think the minute has passed.").fadeIn('slow').delay(4000).fadeOut('slow', function() {
                                          $('.ques').html("Once you feel like it's been about a minute, go<br/>ahead and gently press the button.").fadeIn('slow').delay(4000).fadeOut('slow', function() {
                                            $('.ques').html("Don't forget to keep breathing even after you<br/>press the button.").fadeIn('slow').delay(4000).fadeOut('slow');
                                          });
                                        });
                                      });
                                    });
                                  });
                                });
                              });
                            });
                          });
                        });
                      });

                    });
                  });
                  break;
                case 3:
                  smoothlyChange("That's about as precise an answer as any<br/>answer to any question you will ever ask.");
                  break;
                case 4:
                  smoothlyChange("But when it's inside the brain, and you're actually<br/>experiencing it, a minute can shrink and stretch<br/>depending on how you spend it.");
                  break;
                case 6:
                  smoothlyChange("And unless you're sitting around watching a cesium-133<br/>atom, your idea of a minute is anything but precise.");
                  break;
                case 6:
                  smoothlyChange("Nobody's been able to locate a phisical part of the<br/>brain that's solely responsible for time-keeping.");
                  break;
                default:
                  window.location.pathname = pathPrefix + 'catc.html';
                  break;
              }
            });
          });
        });
      });
    });
  });
