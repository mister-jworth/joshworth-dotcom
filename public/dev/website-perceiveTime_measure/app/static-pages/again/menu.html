  .menuitem {
    width: 15%;
    height: 15%;
    left: 50%;
    top: 40%;
    position: absolute;
    margin: 0;
    opacity: 0.6;
    border: 10px black solid;
    border-radius: 20%;
    -webkit-transition: 1s; /* Safari */
    transition: 1s;
  }
  .menuitem:hover {
    opacity: 1;
    /*transform: scale(1.1);*/
    -webkit-transform:rotate(15deg) scale(1.3);
    -moz-transform:rotate(15deg) scale(1.3);
    -ms-transform:rotate(15deg) scale(1.3);
    -o-transform:rotate(15deg) scale(1.3);
    transform:rotate(15deg) scale(1.3);
  }
  
  #clock {
    left: 15%;
  }
  #clock:hover {
    transform:rotate(360deg) scale(1.3);
  }
  
  #greencat {
    left: 35%;
  }
  
  #fuse {
    left: 55%;

  #future {
    left: 75%;
  }

    top: 65%;

    left: 35%;
    top: 65%;
  }
  
  #waves {

    top: 65%;

  #toggl {

    top: 65%;
  }
  
  p.title {
    font-size: 60px;
    position: absolute;
    left: 20%;
    top: 5%;
    margin: 0
  }
  
  #close {
    width: 5%;
    height: 5%;
    position: absolute;
    right: 10%;
    top: 5%;
    -webkit-transition: 1s; /* Safari */
    transition: 1s;
  }
  #close:hover {
    transform: scale(0.8);
  }
