  <script type="text/javascript">
  var clickCount = 0;

  function smoothlyChange(str) {
    $('.ques').fadeOut('slow', function() {
      $('.ques').html(str);
      $('.ques').fadeIn('slow');
    });
  }
  $(document).ready(function() {
    console.log("ready!");
    $("#slider-range-min ").slider({
      value: 5
    });
    $("#slider-range-select").slider({
      slide: function(event, ui) {
        console.log($('#slider-range-select').slider("value"));
        $.cookie("yourChoice", $('#slider-range-select').slider("value"));
        $('#time').text(function() {
          val = $('#slider-range-select').slider("value");
          sec = Math.round(5 + 85 * ((val - 30) / 120));
          console.log(sec);
          return Math.floor(sec / 60) + ':' + sec % 60;
        });
        $('#time').css('left', function() {
          var temp;
          temp = $('#slider-range-select').slider("value") - 30;
          temp = Math.round(temp / 120 * 50 + 25);
          return temp + '%';
        });
      }
    });
    var past, now, delaySec, dmin, dsec;
    var data;
    $.getJSON("SvgJsons/clock.json", function(json) {
      comp_speedrings = new SVGAnim(json, 135, 135, 50);
      $('svg:last-child').css({
        'width': '200px',
        'height': '200px',
        'position': 'absolute',
        'left': '37.5%',
        'top': '55%',
        'transform': 'translate(-50%,-50%)',
        'display': 'none'
      });
      $.getJSON("SvgJsons/go-button.json", function(json) {
        comp_speedrings = new SVGAnim(json, 87, 87, 100);
        $('svg:last-child').css({
          'position': 'absolute',
          'left': '50%',
          'top': '70%',
          'transform': 'translate(-50%,-50%)',
          'display': 'none'
        });
        $.getJSON("SvgJsons/next-button.json", function(json) {
          comp_speedrings = new SVGAnim(json, 79, 39, 100);
          $('svg:last-child').css({
            'position': 'absolute',
            'left': '50%',
            'top': '75%',
            'transform': 'translate(-50%,-50%)'
          });
          $('svg:last-child').click(function() {
            clickCount++;
            console.log(clickCount);

            switch (clickCount) {
              case 1:
                smoothlyChange("For most people, waiting around is one way to<br/>enter a serious time wrap.");
                break;
              case 2:
                smoothlyChange("Have you ever waited for a child to tie his shoes?<br/><br/>It can sometimes take up to five years.");
                break;
              case 3:
                smoothlyChange("Start this timer for another example.");
                $('svg:last-child').fadeOut('slow');
                $('svg:last-child').prev().fadeIn('slow');
                $('svg:last-child').prev().click(function() {
                  var d = new Date();
                  console.log(d.getTime());
                  $.cookie("togglMeasureStart", d.getTime());
                  $('svg:last-child').prev().prev().fadeIn('slow');
                  $('svg:last-child').prev().fadeOut('slow');
                  $('#slider-range-min').fadeOut('slow');
                  $('.topShow').fadeOut('slow');
                  $('#present').fadeIn('slow');
                  $('.ques').fadeOut('slow', function() {
                    $('.ques').css('top', '25%');
                    $('.ques').html("When the one minute timer is up, you'll be<br/>rewarded with a very special surprise.").fadeIn('slow').delay(3000).fadeOut('slow', function() {
                      $('.ques').html("You're going to love the surprise.").fadeIn('slow').delay(3000).fadeOut('slow', function() {
                        $('.ques').html("Don't go anywhere.").fadeIn('slow').delay(3000).fadeOut('slow', function() {
                          $('.ques').html("You'll want to be present when we<br/>present the present.").fadeIn('slow').delay(3000).fadeOut('slow', function() {
                            $('#present').fadeOut('slow');
                            $('#rainbowcat').fadeIn('slow');
                            $('.ques').html("It's actually just another cat.").fadeIn('slow').delay(3000).fadeOut('slow', function() {
                              $('.ques').html("But it's a rainbow cat.").fadeIn('slow').delay(3000).fadeOut('slow', function() {
                                $('.ques').html("The real surprise is that the minute wasn't<br/>really a minute at all.").fadeIn('slow').delay(3000).fadeOut('slow', function() {
                                  $('.ques').html("How long do you think you were waiting<br/>for your rainbow cat?").fadeIn('slow');
                                  $('#rainbowcat').fadeOut('slow');
                                  $('svg:last-child').prev().prev().fadeOut('slow');
                                  $('#slider-range-select').fadeIn('slow');
                                  $('.forSlider').fadeIn('slow');
                                  $('svg:last-child').fadeIn('slow').click(function(){
                                    $.cookie('togglWhere','surprise');
                                    console.log('togglWhere',$.cookie('togglWhere'));
                                    window.location.pathname = pathPrefix + "actually.html";
                                  });

                                });
                              });
                            });
                          });
                        });
                      });
                    });
                  });
                });
                break;
              case 4:
                smoothlyChange("That's about as precise an answer as any<br/>answer to any question you will ever ask.");
                break;
              case 5:
                smoothlyChange("But when it's inside the brain, and you're actually<br/>experiencing it, a minute can shrink and stretch<br/>depending on how you spend it.");
                break;
              case 6:
                smoothlyChange("And unless you're sitting around watching a cesium-133<br/>atom, your idea of a minute is anything but precise.");
                break;
              case 6:
                smoothlyChange("Nobody's been able to locate a phisical part of the<br/>brain that's solely responsible for time-keeping.");
                break;
              default:
                window.location.pathname = pathPrefix + 'catc.html';
                break;
            }
          });
        });
      });
    });
  });
  </script>
