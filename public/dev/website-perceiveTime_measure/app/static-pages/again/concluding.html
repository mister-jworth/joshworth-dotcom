  <script type="text/javascript">
  var clickCount = 0;

  function smoothlyChange(str) {
    $('.ques').fadeOut('slow', function() {
      $('.ques').html(str);
      $('.ques').fadeIn('slow');
    });
  }
  $(document).ready(function() {
    console.log("ready!");
    $("#slider-range-min ").slider({
      value: 8
    });
    $("#slider-range-select").slider({
      slide: function(event, ui) {
        console.log($('#slider-range-select').slider("value"));
        $.cookie("yourChoice", $('#slider-range-select').slider("value"));
        $('#time').text(function() {
          val = $('#slider-range-select').slider("value");
          sec = Math.round(5 + 85 * ((val - 30) / 120));
          console.log(sec);
          return Math.floor(sec / 60) + ':' + sec % 60;
        });
        $('#time').css('left', function() {
          var temp;
          temp = $('#slider-range-select').slider("value") - 30;
          temp = Math.round(temp / 120 * 50 + 25);
          return temp + '%';
        });
      }
    });
    var past, now, delaySec, dmin, dsec;
    var data;
    $.getJSON("SvgJsons/next-button.json", function(json) {
      comp_speedrings = new SVGAnim(json, 79, 39, 100);
      $('svg:last-child').css({
        'position': 'absolute',
        'left': '50%',
        'top': '75%',
        'transform': 'translate(-50%,-50%)'
      });
      $('svg:last-child').click(function() {
        clickCount++;
        console.log(clickCount);

        switch (clickCount) {
          case 1:
            smoothlyChange("It's pretty impressive that you have any<br/>internal sense of time of at all, considering<br/>your brain is a clock made of meat that<br/>was originally developed by monkeys.");
            break;
          case 2:
            smoothlyChange("Luckily, we've invented handy tools like clocks and<br/>calendars to help us out.");
            break;
          case 3:
            smoothlyChange('<b>Toggl</b>,the company who was kind enough to<br/>sponsor this project, has created an easy time-<br/>tracking tool to help answer the age-old question-<br/>"where on earth did all my time go?"');

            break;
          case 4:
            
            $('.ques').fadeOut('slow',function(){
              smoothlyChange("Thank you for taking the<br/>time to think about time.");  
              $('.topShow').fadeIn('slow');
              $('svg:last-child').fadeOut('slow');
              $('#togglMark').slideDown('3000');
            });         
            break;
        }
      });
    });
    $('#togglMark').click(function(){
      window.location.href = "http://toggl.com";
    });
  });
  </script>
