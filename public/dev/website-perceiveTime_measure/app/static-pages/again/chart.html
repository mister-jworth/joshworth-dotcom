          return width / 120 * you;
        };
        return index * 25 + '%';
      });
    });

      .data(dataArray)
      .enter()
      .append('rect')
      .style('fill', 'gray')
      .attr('width', width / 240)
      .attr('height', function(d) {
        return myheightScale(d);
      })
      .attr('x', function(d, i) {
        return i * width / 120;
      })
      .attr('y', function(d, i) {
        return height - myheightScale(d);
      });

    $('rect').each(function(index) {
      if (index == (you)) {
        $(this).css('fill', 'red');
      };
    });
