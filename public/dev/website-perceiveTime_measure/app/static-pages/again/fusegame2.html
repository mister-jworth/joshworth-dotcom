  <script type="text/javascript">
  var clickCount = 0,
    ran, originc, starCount = 0;
  $(document).ready(function() {
    console.log("ready!");
    $('.descbut').html("Press the button<br>when you're ready to<br> start the timer");
    var past, now, delaySec, dmin, dsec;
    $.getJSON("SvgJsons/fuse.json", function(json) {
      comp_speedrings1 = new SVGAnim(json, 577, 74, 24);
      $('svg:last-child').css({
        'width': '90%',
        'height': '30%',
        'position': 'absolute',
        'top': '0',
        'right': '-30',
        'z-index': '-100'
      });
      $.getJSON("SvgJsons/go-button.json", function(json) {
        comp_speedrings2 = new SVGAnim(json, 87, 87, 100);
        $('svg:last-child').css({
          'position': 'absolute',
          'left': '50%',
          'top': '80%',
          'transform': 'translate(-50%,-50%)'
        });
        $.getJSON("SvgJsons/stop-button.json", function(json) {
          comp_speedrings3 = new SVGAnim(json, 87, 87, 100);
          $('svg:last-child').css({
            'position': 'absolute',
            'left': '50%',
            'top': '80%',
            'transform': 'translate(-50%,-50%)',
            'display': 'none'
          });
          $('svg:last-child').prev().click(function() {
            var d = new Date();
            console.log(d.getTime());
            $.cookie("togglMeasureStart", d.getTime());
            $(this).fadeOut('slow');
            $('svg:last-child').fadeIn('slow');
            $('#iconCheck').fadeOut('fast', function() {
              $(this).css('opacity', '1');
              $(this).fadeIn('fast');
            });
            $('.ques').fadeOut('slow');
            $('.descbut').fadeOut('slow', function() {
              $('.descbut').html("Press the button<br/>when you think a<br/>minute is up.");
              $('.descbut').fadeIn('slow').delay(7000).fadeOut('slow');
            });
            $('#iconCheck').click(function() {
              clickCount++;
              console.log(clickCount);
              $('#iconCheck').fadeOut('fast').delay(3000).fadeIn('slow');
              $('#iconWrong').fadeIn('fast').delay(3000).fadeOut('slow');

              if (clickCount > 0) {
                ran = Math.round(Math.random() * 10);
                console.log(ran);
                if (ran % 3 == originc) {
                  ran++;
                }
                switch (ran % 3) {
                  case 0:
                    starCount++;
                    $('body').css('background', 'green');
                    $('.mcircle circle').css('fill', 'green');
                    $('#star').fadeIn('slow').delay(5000).fadeOut('slow');
                    $('.ques').fadeOut('slow', function() {
                      $('.ques').html("Great! See how many stars you can get. Now - " + starCount);
                      $('.ques').fadeIn('slow').delay(3000).fadeOut('slow');
                    });
                    break;
                  case 1:
                    $('body').css('background', '#FF8C00');
                    $('.mcircle circle').css('fill', '#FF8C00');
                    break;
                  case 2:
                    $('body').css('background', 'black');
                    $('.ques').fadeOut('slow', function() {
                      $('.ques').html("Forgot to mention... the fuse burns<br/>faster if you guess wrong.");
                      $('.ques').fadeIn('slow').delay(3000).fadeOut('slow');
                    });
                    break;
                }
                originc = ran % 3;
              }
            });
          });
          $('svg:last-child').click(function() {
            $.cookie('togglWhere','fuse');
            console.log('togglWhere',$.cookie('togglWhere'));
            window.location.pathname = pathPrefix + "actually.html";
          });
        });
      });
    });
  });
  </script>
