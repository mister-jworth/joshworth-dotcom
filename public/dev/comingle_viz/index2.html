<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Comingle Data Simulation</title>
<link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700" rel="stylesheet">
<link href="styles.css" rel="stylesheet" type="text/css">
</head>

<body>
	<div id="datasettings">
		<div class="val" id="members">
			<div class="label color1">Members</div>
			<div class="v1 color1">2000</div>
		</div>
		<div class="val" id="med_income">
			<div class="label color1">Median Income</div>
			<div class="v1 color2"><span class="symb">$</span>30k<span class="selectarrow"</span></div>
		</div>
		<div class="val" id="highest_income">
			<div class="label color1">Highest Income</div>
			<div class="v1 color2"><span class="symb">$</span>500k<span class="selectarrow"</span></div>
		</div>
		<div class="val" id="cashflow_variation">
			<div class="label color1">Cashflow Variation</div>
			<div class="v1 color2">Sporadic<span class="selectarrow"</span></div>
		</div>
		<div class="val" id="med_monthly_bills">
			<div class="label color1">Median Monthly Bills</div>
			<div class="v1 color3"><span class="symb">$</span>400<span class="selectarrow"</span></div>
		</div>
		<div class="val" id="max_monthly_bills">
			<div class="label color1">Maximum Monthly Bills</div>
			<div class="v1 color3"><span class="symb">$</span>400<span class="selectarrow"</span></div>
		</div>
	</div>
	<div id="daily_activity">
		<div class="label color1">Daily Activity of 100 Random Members</div>
		<div id="activity_chart"><img src ="img/activity-chart.svg"></div>
	</div>
	
	
	<div class="a1">
	<div class="a2">header<div class="a2">1</div></div>
	</div>

</body>
</html>
